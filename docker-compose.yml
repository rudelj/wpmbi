services:
  etsi-wpm-suite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etsi-wpm-suite
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:8081"
    environment:
      - PORT=8081
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - ROOT_PATH=${ROOT_PATH:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
